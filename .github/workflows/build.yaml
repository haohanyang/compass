name: Build packages

on:
  push:
    branches: ['*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run bootstrap
      - run: npm run pack-all
      - run: |
          mkdir pkgs
          mv packages/*/*.tgz ./pkgs
          mv configs/*/*.tgz ./pkgs
      - uses: actions/upload-artifact@v4
        with:
          path: pkgs/
